<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141a16"/>
      <stop offset="50%" style="stop-color:#1c2420"/>
      <stop offset="100%" style="stop-color:#141a16"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d8a4b"/>
      <stop offset="100%" style="stop-color:#2f6b3a"/>
    </linearGradient>
    <linearGradient id="freshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6fcf7f"/>
      <stop offset="50%" style="stop-color:#a8e6a3"/>
      <stop offset="100%" style="stop-color:#6fcf7f"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6fcf7f;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a8e6a3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6fcf7f;stop-opacity:0"/>
      <animate attributeName="x1" values="-50%;50%;-50%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="50%;150%;50%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.6" fill="#6fcf7f" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="800" height="200" fill="url(#bg)" rx="8"/>
  <rect width="800" height="200" fill="url(#dots)" rx="8"/>

  <!-- the leaf tile, same as the page logo -->
  <rect x="40" y="58" width="76" height="76" rx="20" fill="url(#leafGrad)"/>
  <rect x="40" y="58" width="76" height="76" rx="20" fill="none" stroke="#a8e6a3" stroke-opacity="0.35"/>
  <text x="78" y="112" text-anchor="middle" font-size="44" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🥬</text>

  <!-- EZRAFRESH wordmark -->
  <text x="136" y="113" font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="900" font-size="58" letter-spacing="-1.5">
    <tspan fill="#e8ede8">EZRA</tspan><tspan fill="url(#freshGrad)">FRESH</tspan>
  </text>

  <!-- tagline -->
  <text x="138" y="146" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9fb3a4" letter-spacing="0.5">Kochbox ohne Kochbox</text>

  <!-- floating sparkles -->
  <text font-family="serif" font-size="14" fill="#a8e6a3">
    <tspan x="470" y="70">✦</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </text>
  <text font-family="serif" font-size="10" fill="#6fcf7f">
    <tspan x="560" y="78">✦</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </text>
  <text font-family="serif" font-size="16" fill="#e0a62a">
    <tspan x="500" y="140">✧</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </text>
  <text font-family="serif" font-size="9" fill="#e8ede8">
    <tspan x="590" y="128">✦</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
  </text>
  <text font-family="serif" font-size="12" fill="#e0a62a">
    <tspan x="540" y="105">·</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.2s" repeatCount="indefinite"/>
  </text>
  <text font-family="serif" font-size="11" fill="#a8e6a3">
    <tspan x="610" y="105">✧</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <!-- underline -->
  <rect x="40" y="168" width="440" height="2" fill="url(#lineGrad)" rx="1"/>
</svg>
